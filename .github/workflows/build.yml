name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and export templates
        run: |
          cd $RUNNER_TEMP
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore $RUNNER_TEMP/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > ~/.config/godot/editor_settings-4.3.tres
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> ~/.config/godot/editor_settings-4.3.tres
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> ~/.config/godot/editor_settings-4.3.tres
          printf 'export/android/debug_keystore = "%s/debug.keystore"\n' "$RUNNER_TEMP" >> ~/.config/godot/editor_settings-4.3.tres
          printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> ~/.config/godot/editor_settings-4.3.tres
          printf 'export/android/debug_keystore_pass = "android"\n' >> ~/.config/godot/editor_settings-4.3.tres

      - name: Find the Godot project
        run: |
          if [ -f project.godot ]; then
            PROJECT_DIR="."
          else
            mkdir -p project_src
            unzip -q Escape_the_Laboratory_android.zip -d project_src
            PROJECT_FILE=$(find project_src -name project.godot | head -n 1)
            if [ -z "$PROJECT_FILE" ]; then
              echo "project.godot not found in the zip"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project folder: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Enable ETC2/ASTC textures for Android
        run: |
          python3 - <<'PY'
          import os, re
          p = os.environ["PROJECT_DIR"] + "/project.godot"
          s = open(p).read()
          key = "textures/vram_compression/import_etc2_astc"
          if key in s:
              s = re.sub(key + r"\s*=.*", key + "=true", s)
          elif "[rendering]" in s:
              s = s.replace("[rendering]\n", "[rendering]\n\n" + key + "=true\n", 1)
          else:
              s += "\n[rendering]\n\n" + key + "=true\n"
          open(p, "w").write(s)
          PY
          grep -n "etc2_astc" "$PROJECT_DIR/project.godot"

      - name: Create Android export preset
        run: |
          if [ -f "$PROJECT_DIR/export_presets.cfg" ]; then
            mv "$PROJECT_DIR/export_presets.cfg" "$PROJECT_DIR/export_presets.cfg.old"
          fi
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""

          [preset.0.options]

          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.escapelab"
          package/name="Escape the Laboratory"
          package/signed=true
          screen/immersive_mode=true
          EOF

      - name: Show debug info
        run: |
          echo "--- ANDROID_HOME: $ANDROID_HOME"
          ls $ANDROID_HOME
          echo "--- cmdline-tools"; ls $ANDROID_HOME/cmdline-tools
          echo "--- build-tools"; ls $ANDROID_HOME/build-tools
          echo "--- platforms"; ls $ANDROID_HOME/platforms
          echo "--- JAVA_HOME: $JAVA_HOME"
          echo "--- templates"; ls ~/.local/share/godot/export_templates/4.3.stable
          echo "--- editor settings"; cat ~/.config/godot/editor_settings-4.3.tres
          echo "--- keystore"; ls -la $RUNNER_TEMP/debug.keystore

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/game.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
